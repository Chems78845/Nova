<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA - L'actualité du gaming</title>
    <style>
        /* CHARTE GRAPHIQUE NOVA */
        :root {
            --bg-dark: #101014;
            --bg-card: #17171F;
            --primary: #B5A0FF;
            --secondary: #9275F5;
            --blue: #4169FF;
            --text: #FFFFFF;
            --text-muted: #A0A0B0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text); line-height: 1.6; }
        
        /* NAVBAR */
        nav { background-color: var(--bg-card); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2A2A35; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 2rem; font-weight: 900; background: linear-gradient(90deg, var(--primary), var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 1.5rem; }
        .nav-links a { color: var(--text); text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: var(--primary); }
        
        /* CONTAINER */
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(90deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 1.1rem; }
        h2 { font-size: 1.8rem; margin-bottom: 1.5rem; color: var(--primary); border-left: 4px solid var(--blue); padding-left: 15px; }

        /* GRID & CARDS */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
        .card { background-color: var(--bg-card); border-radius: 16px; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; border: 1px solid #2A2A35; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(65, 105, 255, 0.15); border-color: var(--primary); }
        .card-img { width: 100%; height: 200px; object-fit: cover; background-color: #000; }
        .card-content { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .card-content .source { font-size: 0.8rem; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .card-content h3 { margin: 0.8rem 0; font-size: 1.3rem; line-height: 1.3; }
        .card-content p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1; }
        .btn { display: inline-block; padding: 0.8rem 1.5rem; background: linear-gradient(90deg, var(--secondary), var(--blue)); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; transition: opacity 0.3s; text-align: center; }
        .btn:hover { opacity: 0.8; }
        
        .loading { text-align: center; padding: 4rem; font-size: 1.2rem; color: var(--primary); }
        .error { text-align: center; color: #ff4a4a; padding: 2rem; background: rgba(255, 74, 74, 0.1); border-radius: 8px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">NOVA</div>
        <div class="nav-links">
            <a href="#">Accueil</a>
            <a href="#actualites">Actualités</a>
            <a href="#">Jeux gratuits</a>
            <a href="#">Esport</a>
            <a href="#">Guides</a>
        </div>
    </nav>

    <div class="container">
        <h1>Toute l'actualité du gaming</h1>
        <p class="subtitle">Les dernières news de l'industrie, mises à jour en temps réel.</p>
        
        <h2 id="actualites">Les dernières actualités</h2>
        <div id="news-container" class="grid">
            <div class="loading">Chargement des actualités...</div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

        // --- CONFIGURATION SUPABASE ---
        // C'est ici qu'on met l'URL et la clé PUBLIQUE (anon)
        const SUPABASE_URL = 'https://ayqgfvqpnhxtjfmmijcp.supabase.co';
        // Remplace la ligne ci-dessous par ta clé "anon public" (trouvable dans Supabase -> Settings -> API)
        const SUPABASE_ANON_KEY = 'sb_publishable_aU7IeBMNCKdrG5zb4kV2Dg_EgF73rw1';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadNews() {
            const container = document.getElementById('news-container');
            
            // On récupère les 12 derniers articles
            const { data: articles, error } = await supabase
                .from('articles')
                .select('*')
                .order('published_at', { ascending: false })
                .limit(12);

            if (error) {
                console.error(error);
                container.innerHTML = `<div class="error">Erreur : Impossible de charger les actualités.</div>`;
                return;
            }

            if (articles.length === 0) {
                container.innerHTML = `<div class="loading">Aucun article pour le moment.</div>`;
                return;
            }

            // On génère les cartes
            container.innerHTML = articles.map(article => {
                // Nettoyage des descriptions (parfois il y a du HTML brut des flux RSS)
                let cleanDesc = article.description || '';
                cleanDesc = cleanDesc.replace(/<[^>]*>?/gm, ''); // Enlève les balises HTML
                if (cleanDesc.length > 150) cleanDesc = cleanDesc.substring(0, 150) + '...';

                return `
                    <div class="card">
                        <div class="card-content">
                            <span class="source">${article.source_name || 'NOVA'}</span>
                            <h3>${article.title}</h3>
                            <p>${cleanDesc || 'Pas de description.'}</p>
                            <a href="${article.source_url}" target="_blank" class="btn">Lire l'article →</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        loadNews();
    </script>
</body>
</html>
